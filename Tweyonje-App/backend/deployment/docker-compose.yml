name: tweyonje

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tweyonje
      POSTGRES_USER: tweyonje
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tweyonje"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME:-tweyonje}/tweyonje-backend:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    # Daphne serves both HTTP and WebSocket (realtime updates).
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  celery-worker:
    image: ${DOCKER_USERNAME:-tweyonje}/tweyonje-backend:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../:/app
      - media_data:/app/media
    command: celery -A config worker -l info

  celery-beat:
    image: ${DOCKER_USERNAME:-tweyonje}/tweyonje-backend:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../:/app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    image: ${DOCKER_USERNAME:-tweyonje}/tweyonje-frontend:${FRONTEND_TAG:-latest}
    build: ../../frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/app/staticfiles:ro

volumes:
  pgdata:
  media_data:
  static_data: