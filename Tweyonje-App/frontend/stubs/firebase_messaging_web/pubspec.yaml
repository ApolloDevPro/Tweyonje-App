name: firebase_messaging_web
description: >-
  Local no-op web implementation of firebase_messaging_web.
  Keeps the generated Flutter web plugin registrant compiling while the
  real firebase_messaging web interop is incompatible with this toolchain.
version: 3.5.18

publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  firebase_messaging_platform_interface: ^4.5.37
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter